version: '3.8'

services:
  adonis-api:
    image: hrms
    container_name: hrms
    restart: unless-stopped
    build:
      context: .
      target: development
    ports:
      - '3333:3333'
      - '9229:9229'
    env_file:
      - .env
    volumes:
      - ./:/home/node/app
      - /home/node/app/node_modules
    command: node ace serve --watch
